name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-backend:
    name: Standalone backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is temporarily excluded until the Windows app ships.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo test --locked --no-default-features --features standalone --test platform_native
      - run: cargo check --locked --all-targets --no-default-features --features standalone
      - run: cargo test --locked --no-default-features --features standalone process
      - run: cargo test --locked --no-default-features --features standalone --test cli agent_disabled_build_has_no_worker_or_agent_rpc

  standalone-app-macos:
    name: Standalone app (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.8.3"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.0.0"
      - run: python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
      - name: Build and test the standalone host
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Omamail
          QT_QUICK_CONTROLS_FALLBACK_STYLE: Basic
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-backend.py check)"
          cargo test --locked --no-default-features --features standalone,integration-test-credentials
          cargo build --release --locked --no-default-features --features standalone
          cmake -S app -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMAMAIL_BACKEND="$PWD/target/release/omamail"
          cmake --build build/app
          ctest --test-dir build/app --output-on-failure
          python3 app/tests/test_qml_inventory.py
          qmltestrunner -input app/tests/qml/tst_host_contract.qml -import app/qml/imports -import app/qml/styles -import ui
          python3 tests/test_backend_api.py --binary target/release/omamail --expected-version "$version" --standalone
      - name: Build and exercise the production archive
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-backend.py check)"
          bash app/scripts/package-release.sh macos-aarch64 --host "$PWD/build/app/omamail-app" --backend "$PWD/target/release/omamail"
          python3 app/tests/test_package.py
          bash app/tests/test_install.sh
          mkdir -p "$RUNNER_TEMP/omamail-smoke"
          tar -xzf dist/omamail-app-macos-aarch64.tar.gz -C "$RUNNER_TEMP/omamail-smoke"
          host="$RUNNER_TEMP/omamail-smoke/Omamail.app/Contents/MacOS/omamail-app"
          backend="$RUNNER_TEMP/omamail-smoke/Omamail.app/Contents/MacOS/omamail"
          "$host" --check-resources
          "$host" --smoke-test "$RUNNER_TEMP/omamail-ready.json"
          python3 tests/test_backend_api.py --binary "$backend" --expected-version "$version" --standalone

  standalone-app-linux:
    name: Standalone app (Linux x86_64, glibc 2.35)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.8.3"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.0.0"
      - name: Install pinned build tools and Qt runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-3 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 patchelf
      - name: Build and test the standalone host
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Omamail
          QT_QUICK_CONTROLS_FALLBACK_STYLE: Basic
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-backend.py check)"
          cargo test --locked --no-default-features --features standalone,integration-test-credentials
          cargo build --release --locked --no-default-features --features standalone
          cmake -S app -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMAMAIL_BACKEND="$PWD/target/release/omamail"
          cmake --build build/app
          ctest --test-dir build/app --output-on-failure
          python3 app/tests/test_qml_inventory.py
          qmltestrunner -input app/tests/qml/tst_host_contract.qml -import app/qml/imports -import app/qml/styles -import ui
          python3 tests/test_backend_api.py --binary target/release/omamail --expected-version "$version" --standalone
      - name: Build and exercise the production archive
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-backend.py check)"
          bash app/scripts/package-release.sh linux-x86_64 --host "$PWD/build/app/omamail-app" --backend "$PWD/target/release/omamail"
          python3 app/tests/test_package.py
          bash app/tests/test_install.sh
          mkdir -p "$RUNNER_TEMP/omamail-smoke"
          tar -xzf dist/omamail-app-linux-x86_64.tar.gz -C "$RUNNER_TEMP/omamail-smoke"
          host="$RUNNER_TEMP/omamail-smoke/omamail.app/bin/omamail-app"
          backend="$RUNNER_TEMP/omamail-smoke/omamail.app/bin/omamail"
          "$host" --check-resources
          "$host" --smoke-test "$RUNNER_TEMP/omamail-ready.json"
          python3 tests/test_backend_api.py --binary "$backend" --expected-version "$version" --standalone

