name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-backend:
    name: Standalone backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo test --locked --no-default-features --features standalone --test platform_native
      - run: cargo check --locked --all-targets --no-default-features --features standalone
      - run: cargo test --locked --no-default-features --features standalone process
      - run: cargo test --locked --no-default-features --test cli agent_disabled_build_has_no_worker_or_agent_rpc

  # The NSH app's Rust module (ext/omamail-native): the typed library
  # facade it links and the worker thread that drives it.
  nsh-native:
    name: NSH app module
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ext/omamail-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ext/omamail-native
      - run: cargo fmt --check -p omamail-native
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # iOS and Android apps run the backend in-process (no `omamail serve`
  # child). Keep the library building there so desktop-only code paths stay
  # behind explicit platform branches.
  mobile-backend:
    name: Mobile backend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            os: macos-latest
            targets: aarch64-apple-ios aarch64-apple-ios-sim
          - name: Android
            os: ubuntu-latest
            targets: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          key: mobile-${{ matrix.name }}
      - name: Use the Android NDK toolchain
        if: matrix.name == 'Android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      - name: cargo check --lib
        run: |
          for target in ${{ matrix.targets }}; do
            cargo check --locked --lib --target "$target"
          done

  # The mail library's own unit tests, including the parity checks that run
  # the Omarchy plugin's JavaScript under Node.
  core-tests:
    name: Mail core (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo test --locked --lib
