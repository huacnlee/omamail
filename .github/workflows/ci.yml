name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-backend:
    name: Standalone backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo test --locked --no-default-features --features standalone --test platform_native
      - run: cargo check --locked --all-targets --no-default-features --features standalone
      - run: cargo test --locked --no-default-features --features standalone process
      - run: cargo test --locked --no-default-features --test cli agent_disabled_build_has_no_worker_or_agent_rpc

  # The NSH app's Rust module (ext/omamail-native): the typed library
  # facade it links and the worker thread that drives it.
  nsh-native:
    name: NSH app module
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ext/omamail-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ext/omamail-native
      - run: cargo fmt --check -p omamail-native
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The TSX app: type checks, the key and native-member drift checks, and
  # the headless `nsh test` suite. The CLI is one exact release, checked
  # against the digest kept here rather than one fetched beside it; move
  # NSH_VERSION and NSH_SHA256 together.
  nsh-app:
    name: NSH app (check and tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NSH_VERSION: v0.7.2
      NSH_SHA256: cb087e1e6afeb4ce4c2e70d8f803ccffe376b0a73d48605e492ec50fbbd45bec
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            ext/omamail-native
            .nsh/rust
      # The drift checks are TypeScript run by Node directly (23.6+).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install nsh ${{ env.NSH_VERSION }}
        run: |
          work=$(mktemp -d)
          curl -fsSL -o "$work/nsh.tar.gz" \
            "https://github.com/longbridge/nsh/releases/download/$NSH_VERSION/nsh-linux-x86_64.tar.gz"
          echo "$NSH_SHA256  $work/nsh.tar.gz" | sha256sum -c -
          tar -xzf "$work/nsh.tar.gz" -C "$HOME"
          echo "$HOME/nsh/bin" >> "$GITHUB_PATH"
      - run: nsh --version
      - run: nsh check
      - run: node scripts/check-keys.ts
      - run: node scripts/check-native-members.ts
      - run: nsh test

  # iOS and Android apps run the backend in-process (no `omamail serve`
  # child). Keep the library building there so desktop-only code paths stay
  # behind explicit platform branches.
  mobile-backend:
    name: Mobile backend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            os: macos-latest
            targets: aarch64-apple-ios aarch64-apple-ios-sim
          - name: Android
            os: ubuntu-latest
            targets: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          key: mobile-${{ matrix.name }}
      - name: Use the Android NDK toolchain
        if: matrix.name == 'Android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      - name: cargo check --lib
        run: |
          for target in ${{ matrix.targets }}; do
            cargo check --locked --lib --target "$target"
          done

  # The mail library's own unit tests, including the parity checks that run
  # the Qt client's JavaScript (vendored in core/tests/oracles) under Node.
  core-tests:
    name: Mail core (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo test --locked --lib
      # The integration tests (tests/*.rs, cli included), as main ran them:
      # integration-test-credentials keeps them off the runner's keyring.
      - run: cargo test --locked --no-default-features --features standalone,integration-test-credentials --tests
      # The assistant's job bridge against fake agent CLIs, driving the native
      # worker the binary runs (target/debug/omamail, built here with default
      # features).
      - run: cargo build --locked
      - run: python3 tests/test_agent_native_bridge.py

  # What existing Omarchy installs read from this checkout after the NSH
  # cutover (the root manifest of the notice bar widget and its one helper),
  # the installers, and the release tooling release.yml runs.
  omarchy-plugin-entry:
    name: Omarchy plugin entry, installers and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # test_release.py verifies a signed update manifest with cryptography.
      - run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*  # unused here, and its outages fail apt-get update
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-cryptography shellcheck
      - run: make -C omarchy test lint
