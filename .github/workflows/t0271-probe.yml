name: T-0271 probe (temporary)
on:
  push:
    branches: [agent/T-0271-probe]
permissions:
  contents: read
jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - name: Environment
        run: |
          uname -r
          grep -E '^CONFIG_HZ=' "/boot/config-$(uname -r)" || true
          findmnt -T /tmp -no FSTYPE,OPTIONS
      - name: Build fix and base
        run: |
          cargo build --release --locked --no-default-features --features standalone
          cp target/release/omamail "$RUNNER_TEMP/omamail.fix"
          git checkout -q 176a381 -- src/agent/jobs.rs src/agent/storage.rs
          cargo build --release --locked --no-default-features --features standalone
          cp target/release/omamail "$RUNNER_TEMP/omamail.base"
          git checkout -q HEAD -- src/agent/jobs.rs src/agent/storage.rs
      - name: Contract runs
        run: |
          run() {
            local pass=0 watched=0 other=0 out
            for _ in $(seq 1 "$2"); do
              if out="$(python3 tests/test_backend_api.py --binary "$RUNNER_TEMP/omamail.$1" --standalone 2>&1)"; then
                pass=$((pass+1))
              elif grep -q 'watched completions.*jobs.0.id' <<<"$out"; then
                watched=$((watched+1))
              else
                other=$((other+1)); echo "$out" | tail -4
              fi
            done
            echo "RESULT $1 pass=$pass watched-fail=$watched other=$other"
          }
          run base 300
          run fix 300
