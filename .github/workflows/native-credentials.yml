name: Native credential contracts

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Native credentials (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision an isolated Secret Service fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Shared validation and failure-classification tests
        shell: bash
        run: cargo test --locked --lib --no-default-features --features standalone credentials
      - name: Native success, Missing, denial and bounded prompt gates (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            fixture=$(mktemp -d)
            trap '\''rm -rf "$fixture"'\'' EXIT
            export XDG_DATA_HOME="$fixture/data"
            export XDG_RUNTIME_DIR="$fixture/runtime"
            mkdir -m 700 -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$fixture/control"
            printf "%s" "synthetic-native-gate-password" | gnome-keyring-daemon --unlock --components=secrets --control-directory="$fixture/control"
            cargo test --locked --lib --no-default-features --features standalone credentials_native -- --ignored --test-threads=1
          '
      - name: Native success, Missing and denial gates (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: cargo test --locked --lib --no-default-features --features standalone credentials_native -- --ignored --test-threads=1
