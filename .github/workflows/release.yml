name: Release

# Tag-driven: pushing v1.2.3 publishes the release for that commit. Nothing
# else creates one, so the tag is the single record of what shipped.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated from the history since the last tag, so
          # a shallow clone would produce an empty changelog.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The manifest version is what Omarchy installs and what the marketplace
      # lists. A tag that disagrees with it would publish a release describing a
      # version nobody can install, so it fails here instead.
      - name: Check the tag matches the manifest
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p 'require("./manifest.json").version')"
          if [ "$tag" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi
          echo "version $manifest"

      # The parsing, formatting and decision rules are plain JS and the source
      # checks are shell, so those need nothing at all and run here.
      #
      # Two gates stay local. qmllint needs the Omarchy shell on the import
      # path, which a runner does not have. The QML tests need the Qt the
      # plugin actually runs on: Ubuntu ships 6.4 and Omarchy is current, and
      # they exercise exactly the engine behaviour that differs between them —
      # shortcut objects rebuilt when a context changes fire on one and not the
      # other. Running them here would report on an engine nobody uses.
      #
      # `make test` includes them, so it is not what runs here.
      - name: Test
        run: make test-js test-shell

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
