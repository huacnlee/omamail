name: Release

# make publish pushes one versioned branch and opens its PR. Plugin and desktop
# assets publish together before CI advances the pin; main remains PR-only.
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
    paths-ignore: ['backend-version', 'backend-api.json']

permissions:
  contents: read

concurrency:
  group: omamail-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          version="$(python3 scripts/package-backend.py check)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          branch="$(VERSION="$version" bash scripts/release-source.sh)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Require an unused release version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Listing must succeed; network/authentication failures never mean absent.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > releases.txt
          if grep -Fx "v$VERSION" releases.txt; then echo 'Release version already exists' >&2; exit 1; else test "$?" -eq 1; fi
      - name: Require a new API revision when the published contract changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-backend.py pin-version)"
          mkdir baseline
          gh release download "v$version" --dir baseline --pattern backend-api.json
          python3 scripts/package-backend.py check-api --baseline baseline/backend-api.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
      - run: make test-js test-shell-portable
      - run: python3 tests/test_backend_release.py
      - run: python3 app/tests/test_release_workflow.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add "${{ matrix.target }}"
      - name: Test and build native static Linux backend
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C linker=musl-gcc
        run: |
          cargo test --locked --features integration-test-credentials
          cargo build --release --locked
      - name: Verify native version and static linkage, then package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/omamail"
          test "$("$binary" --version)" = "omamail $VERSION"
          readelf -l "$binary" > program-headers.txt
          readelf -d "$binary" > dynamic-headers.txt
          if grep -q INTERP program-headers.txt; then echo 'Binary has a dynamic interpreter' >&2; exit 1; else test "$?" -eq 1; fi
          if grep -q NEEDED dynamic-headers.txt; then echo 'Binary has dynamic dependencies' >&2; exit 1; else test "$?" -eq 1; fi
          python3 scripts/package-backend.py check-api
          python3 tests/test_backend_api.py --binary "$binary" --expected-version "$VERSION"
          python3 scripts/package-backend.py package "$binary" "$ARCH" artifact
          python3 scripts/package-backend.py verify artifact --arch "$ARCH"
          python3 scripts/package-backend.py provenance --output artifact/backend-build.json
          cp backend-api.json artifact/backend-api.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ matrix.arch }}
          path: artifact/*
          if-no-files-found: error

  app-macos-aarch64:
    name: Standalone app (macOS arm64)
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.8.3"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.0.0"
      - name: Install pinned CMake and Ninja
        run: python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
      - name: Exercise the native Keychain credential contract
        run: cargo test --locked --lib --no-default-features --features standalone credentials_native -- --ignored --test-threads=1
      - name: Test and build the standalone backend and Qt host
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Omamail
          QT_QUICK_CONTROLS_FALLBACK_STYLE: Basic
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features standalone,integration-test-credentials
          cargo build --release --locked --no-default-features --features standalone
          cmake -S app -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMAMAIL_BACKEND="$PWD/target/release/omamail"
          cmake --build build/app
          ctest --test-dir build/app --output-on-failure
          python3 app/tests/test_qml_inventory.py
          qmltestrunner -input app/tests/qml/tst_host_contract.qml -import app/qml/imports -import app/qml/styles -import ui
          python3 tests/test_backend_api.py --binary target/release/omamail --expected-version "${{ needs.prepare.outputs.version }}" --standalone
      - name: Package, unpack, and test the macOS archive and installer
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          set -euo pipefail
          bash app/scripts/package-release.sh macos-aarch64 \
            --host "$PWD/build/app/omamail-app" \
            --backend "$PWD/target/release/omamail"
          python3 app/tests/test_package.py
          bash app/tests/test_install.sh
          mkdir -p "$RUNNER_TEMP/omamail-smoke"
          tar -xzf dist/omamail-app-macos-aarch64.tar.gz -C "$RUNNER_TEMP/omamail-smoke"
          host="$RUNNER_TEMP/omamail-smoke/Omamail.app/Contents/MacOS/omamail-app"
          backend="$RUNNER_TEMP/omamail-smoke/Omamail.app/Contents/MacOS/omamail"
          "$host" --check-resources
          ready="$RUNNER_TEMP/omamail-ready.json"
          rm -f "$ready"
          "$host" --smoke-test "$ready"
          test -s "$ready"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); assert value["version"] == sys.argv[2] and type(value["apiVersion"]) is int' "$ready" "${{ needs.prepare.outputs.version }}"
          test "$("$backend" --version)" = "omamail ${{ needs.prepare.outputs.version }}"
          python3 tests/test_backend_api.py --binary "$backend" --expected-version "${{ needs.prepare.outputs.version }}" --standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-macos-aarch64
          path: dist/omamail-app-macos-aarch64.tar.gz
          if-no-files-found: error

  app-linux-x86_64:
    name: Standalone app (Linux x86_64, glibc 2.35)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.8.3"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.0.0"
      - name: Install pinned build tools and Qt runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libdbus-1-3 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 patchelf
      - name: Exercise the native Secret Service credential contract
        run: |
          set -euo pipefail
          dbus-run-session -- bash -euo pipefail -c '
            fixture=$(mktemp -d)
            trap '\''rm -rf "$fixture"'\'' EXIT
            export XDG_DATA_HOME="$fixture/data"
            export XDG_RUNTIME_DIR="$fixture/runtime"
            mkdir -m 700 -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$fixture/control"
            printf "%s" "synthetic-native-release-password" | gnome-keyring-daemon --unlock --components=secrets --control-directory="$fixture/control"
            cargo test --locked --lib --no-default-features --features standalone credentials_native -- --ignored --test-threads=1
          '
      - name: Test and build the standalone backend and Qt host
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Omamail
          QT_QUICK_CONTROLS_FALLBACK_STYLE: Basic
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features standalone,integration-test-credentials
          cargo build --release --locked --no-default-features --features standalone
          cmake -S app -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMAMAIL_BACKEND="$PWD/target/release/omamail"
          cmake --build build/app
          ctest --test-dir build/app --output-on-failure
          python3 app/tests/test_qml_inventory.py
          qmltestrunner -input app/tests/qml/tst_host_contract.qml -import app/qml/imports -import app/qml/styles -import ui
          python3 tests/test_backend_api.py --binary target/release/omamail --expected-version "${{ needs.prepare.outputs.version }}" --standalone
      - name: Package, unpack, and test the Linux archive and installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          bash app/scripts/package-release.sh linux-x86_64 \
            --host "$PWD/build/app/omamail-app" \
            --backend "$PWD/target/release/omamail"
          python3 app/tests/test_package.py
          bash app/tests/test_install.sh
          mkdir -p "$RUNNER_TEMP/omamail-smoke"
          tar -xzf dist/omamail-app-linux-x86_64.tar.gz -C "$RUNNER_TEMP/omamail-smoke"
          host="$RUNNER_TEMP/omamail-smoke/omamail.app/bin/omamail-app"
          backend="$RUNNER_TEMP/omamail-smoke/omamail.app/bin/omamail"
          "$host" --check-resources
          ready="$RUNNER_TEMP/omamail-ready.json"
          rm -f "$ready"
          "$host" --smoke-test "$ready"
          test -s "$ready"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); assert value["version"] == sys.argv[2] and type(value["apiVersion"]) is int' "$ready" "${{ needs.prepare.outputs.version }}"
          test "$("$backend" --version)" = "omamail ${{ needs.prepare.outputs.version }}"
          python3 tests/test_backend_api.py --binary "$backend" --expected-version "${{ needs.prepare.outputs.version }}" --standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-linux-x86_64
          path: dist/omamail-app-linux-x86_64.tar.gz
          if-no-files-found: error

  app-windows-x86_64:
    name: Standalone app (Windows x86_64)
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.8.3"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.0.0"
      - name: Install pinned CMake and Ninja
        shell: pwsh
        run: python -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
      - name: Exercise the native Credential Manager contract
        shell: pwsh
        run: |
          cargo test --locked --lib --no-default-features --features standalone credentials_native -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "native credential contract failed" }
      - name: Test and build the standalone backend and Qt host
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Omamail
          QT_QUICK_CONTROLS_FALLBACK_STYLE: Basic
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked --no-default-features --features standalone
          if ($LASTEXITCODE -ne 0) { throw "standalone backend build failed" }
          cmake -S app -B build/app -G "Visual Studio 17 2022" -A x64 -DOMAMAIL_BACKEND="$PWD/target/release/omamail.exe"
          if ($LASTEXITCODE -ne 0) { throw "Qt configuration failed" }
          cmake --build build/app --config Release
          if ($LASTEXITCODE -ne 0) { throw "Qt build failed" }
          ctest --test-dir build/app -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Qt tests failed" }
          python app/tests/test_qml_inventory.py
          if ($LASTEXITCODE -ne 0) { throw "QML inventory failed" }
          qmltestrunner -input app/tests/qml/tst_host_contract.qml -import app/qml/imports -import app/qml/styles -import ui
          if ($LASTEXITCODE -ne 0) { throw "QML tests failed" }
          python tests/test_backend_api.py --binary target/release/omamail.exe --expected-version "${{ needs.prepare.outputs.version }}" --standalone
          if ($LASTEXITCODE -ne 0) { throw "backend API contract failed" }
      - name: Package, unpack, and test the Windows archive and installer
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = "Stop"
          & app/scripts/package-release.ps1 -HostBinary build/app/Release/omamail-app.exe `
            -Backend target/release/omamail.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows package failed" }
          & app/tests/Test-Package.ps1
          & app/tests/Test-Install.ps1
          $smoke = Join-Path $env:RUNNER_TEMP "omamail-smoke"
          Expand-Archive dist/omamail-app-windows-x86_64.zip -DestinationPath $smoke
          $appExecutable = Join-Path $smoke "omamail/bin/omamail-app.exe"
          $backend = Join-Path $smoke "omamail/bin/omamail.exe"
          & $appExecutable --check-resources
          if ($LASTEXITCODE -ne 0) { throw "resource check failed" }
          $ready = Join-Path $env:RUNNER_TEMP "omamail-ready.json"
          Remove-Item -LiteralPath $ready -Force -ErrorAction SilentlyContinue
          & $appExecutable --smoke-test $ready
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $ready -PathType Leaf)) { throw "live smoke failed" }
          $readyValue = Get-Content -LiteralPath $ready -Raw | ConvertFrom-Json
          $apiIsInteger = (($readyValue.apiVersion -is [int]) -or ($readyValue.apiVersion -is [long]))
          if ([string]$readyValue.version -ne "${{ needs.prepare.outputs.version }}" -or -not $apiIsInteger) { throw "live smoke returned invalid readiness metadata" }
          $reported = & $backend --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "omamail ${{ needs.prepare.outputs.version }}") { throw "backend version mismatch" }
          python tests/test_backend_api.py --binary $backend --expected-version "${{ needs.prepare.outputs.version }}" --standalone
          if ($LASTEXITCODE -ne 0) { throw "packaged backend API contract failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-windows-x86_64
          path: dist/omamail-app-windows-x86_64.zip
          if-no-files-found: error

  publish-and-pin:
    needs: [prepare, build, app-macos-aarch64, app-linux-x86_64, app-windows-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: backend-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: app-*
          path: artifacts
      - name: Publish complete release, verify downloads, then advance the release branch pin
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          bash scripts/publish-backend.sh
