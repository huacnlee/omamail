name: Release

# Dispatch on the explicit source branch, including a feature branch before merge.
on:
  workflow_dispatch:
  # Explicit opt-in bootstrap branch; works before dispatch is on main.
  push:
    branches: ['release/backend/**']
    paths-ignore: ['backend-version']

permissions:
  contents: read

concurrency:
  group: backend-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-backend.py check)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require a branch and an unused release version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = branch
          test -n "$GH_TOKEN"
          git check-ref-format "refs/heads/$GITHUB_REF_NAME"
          source_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$source_sha" = "$GITHUB_SHA"
          existing_tag="$(git ls-remote origin "refs/tags/v$VERSION")"
          test -z "$existing_tag"
          # Listing must succeed; network/authentication failures never mean absent.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > releases.txt
          if grep -Fx "v$VERSION" releases.txt; then echo 'Release version already exists' >&2; exit 1; else test "$?" -eq 1; fi
      - name: Require a new API revision when the published contract changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/package-backend.py pin-version)"
          mkdir baseline
          gh release download "v$version" --dir baseline --pattern backend-api.json
          python3 scripts/package-backend.py check-api --baseline baseline/backend-api.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make test-js test-shell-portable
      - run: python3 tests/test_backend_release.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add "${{ matrix.target }}"
      - name: Test and build native static Linux backend
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C linker=musl-gcc
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Verify native version and static linkage, then package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/omamail"
          test "$("$binary" --version)" = "omamail $VERSION"
          readelf -l "$binary" > program-headers.txt
          readelf -d "$binary" > dynamic-headers.txt
          if grep -q INTERP program-headers.txt; then echo 'Binary has a dynamic interpreter' >&2; exit 1; else test "$?" -eq 1; fi
          if grep -q NEEDED dynamic-headers.txt; then echo 'Binary has dynamic dependencies' >&2; exit 1; else test "$?" -eq 1; fi
          python3 scripts/package-backend.py check-api
          python3 tests/test_backend_api.py --binary "$binary" --expected-version "$VERSION"
          python3 scripts/package-backend.py package "$binary" "$ARCH" artifact
          python3 scripts/package-backend.py verify artifact --arch "$ARCH"
          python3 scripts/package-backend.py provenance --output artifact/backend-build.json
          cp backend-api.json artifact/backend-api.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: artifact/*
          if-no-files-found: error

  publish-and-pin:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: artifacts
      - name: Publish complete release, verify downloads, then advance only the pin
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/package-backend.py check --tag "v$VERSION"
          source_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$source_sha" = "$GITHUB_SHA"
          existing_tag="$(git ls-remote origin "refs/tags/v$VERSION")"
          test -z "$existing_tag"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > releases.txt
          if grep -Fx "v$VERSION" releases.txt; then echo 'Release version already exists' >&2; exit 1; else test "$?" -eq 1; fi
          mkdir release-assets
          cp artifacts/backend-x86_64/omamail-linux-x86_64.tar.gz release-assets/
          cp artifacts/backend-aarch64/omamail-linux-aarch64.tar.gz release-assets/
          cat artifacts/backend-x86_64/SHA256SUMS artifacts/backend-aarch64/SHA256SUMS > release-assets/SHA256SUMS
          cmp artifacts/backend-x86_64/backend-api.json artifacts/backend-aarch64/backend-api.json
          cp artifacts/backend-x86_64/backend-api.json release-assets/
          python3 scripts/package-backend.py check-api --published release-assets/backend-api.json
          cmp artifacts/backend-x86_64/backend-build.json artifacts/backend-aarch64/backend-build.json
          cp artifacts/backend-x86_64/backend-build.json release-assets/
          python3 scripts/package-backend.py check-provenance release-assets/backend-build.json
          python3 scripts/package-backend.py verify release-assets
          gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --draft --title "v$VERSION" --generate-notes
          gh release edit "v$VERSION" --draft=false
          mkdir published
          gh release download "v$VERSION" --dir published --pattern 'omamail-linux-*.tar.gz' --pattern SHA256SUMS --pattern backend-build.json --pattern backend-api.json
          python3 scripts/package-backend.py verify published
          python3 scripts/package-backend.py check-provenance published/backend-build.json
          cmp release-assets/backend-api.json published/backend-api.json
          cmp release-assets/backend-build.json published/backend-build.json
          cmp release-assets/SHA256SUMS published/SHA256SUMS
          # Refuse moved refs and push only a pin commit, without force.
          python3 scripts/package-backend.py pin --branch "$GITHUB_REF_NAME" --expected "$GITHUB_SHA"
