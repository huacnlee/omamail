name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/index.html
      - docs/images/**
      - install.sh
      - install.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check installation instructions
        run: python3 tests/test_website_install.py
      # The page is one file, but every screenshot, icon and the og:image it
      # points at lives in docs/images. Staging only the HTML published a site
      # whose images all 404, so the whole image directory ships with it.
      #
      # The installers are served from the site as well, so the install
      # commands name a stable address rather than a branch of the repository.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp -R docs/images _site/images
          cp install.sh _site/install.sh
          cp install.ps1 _site/install.ps1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
