[package]
name = "omamail"
version = "0.9.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
tabled = { version = "0.20", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "hickory-dns"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
hickory-resolver = "0.25"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
unicode-normalization = "0.1"
futures-util = "0.3"
libc = "0.2"
mailparse = "0.17"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
