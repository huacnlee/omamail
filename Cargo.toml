[package]
name = "omamail"
version = "0.10.4"
edition = "2024"
publish = false

[features]
default = ["agent"]
agent = []
standalone = []
integration-test-credentials = []

[dependencies]
clap = { version = "4", features = ["derive"] }
tabled = { version = "0.20", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "hickory-dns"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
hickory-resolver = "0.25"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
unicode-normalization = "0.1"
futures-util = "0.3"
libc = "0.2"
mailparse = "0.17"
regex = "1"
quick-xml = "0.38"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rustls-native-certs = "0.8"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
