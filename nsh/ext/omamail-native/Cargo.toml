[package]
name = "omamail-native"
version = "0.1.0"
edition = "2024"
description = "Omamail's Rust for the NSH app: the mail library and its look, as an nshm."
license = "MIT"
keywords = ["nshm"]
publish = false

# Its own workspace: the app's crate, not a member of the omamail one.
[workspace]

[dependencies]
# Without `agent`: the assistant workers re-launch the executable, which is
# the NSH host here. P1 does not use them.
omamail = { path = "../../..", default-features = false }
nsh-core = "0.7.0"
nsh-omarchy = "0.2.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync"] }
log = "0.4"
