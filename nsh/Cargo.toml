[package]
name = "omamail-nsh"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.0"
nsh-base = "0.6.0"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nsh-engine = { version = "0.6.0", default-features = false }
nsh-testing = { version = "0.6.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["svg", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["svg", "net"] }
