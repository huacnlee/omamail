kind = "app"
name = "Omamail"
summary = "Native mail and calendar app for Gmail, Outlook, HEY, JMAP and IMAP, with multiple accounts and keyboard navigation."
categories = ["Network", "Email", "Office"]
icon = "assets/icon.png"
screenshots = [
  "docs/images/full-mail.webp",
  "docs/images/full-calendar.webp",
  "docs/images/full-compose.webp",
  "docs/images/mini-list.webp",
]

# The NSH app's Linux package (`nsh package --target linux`): Omamail/Omamail
# is the app, beside its nsh/ bundle. It needs GTK 4.14+ and WebKitGTK 6.0.
[linux.x86_64]
asset = "Omamail-{version}-linux-x86_64.tar.gz"
exec = "Omamail/Omamail"

# Not published: until it is, the app is not installable on ARM rather than
# getting another architecture's package.
[linux.aarch64]
asset = "Omamail-{version}-linux-aarch64.tar.gz"
exec = "Omamail/Omamail"
